<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 30" width="100%" height="100%">
  <defs>
    <!-- Tokyo Night Gradients -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0" />
      <stop offset="15%" stop-color="#7aa2f7" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#bb9af3" stop-opacity="1" />
      <stop offset="50%" stop-color="#73daca" stop-opacity="1" />
      <stop offset="55%" stop-color="#bb9af3" stop-opacity="1" />
      <stop offset="85%" stop-color="#73daca" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#73daca" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .glow-line {
        stroke: url(#line-grad);
        stroke-width: 1.5;
        stroke-linecap: round;
        animation: pulseLine 3s ease-in-out infinite alternate;
      }
      
      .center-symbol {
        fill: #161925;
        stroke: #bb9af3;
        stroke-width: 1.5;
        animation: rotateSymbol 8s linear infinite;
        transform-origin: 425px 15px;
      }

      .pulse-ring {
        fill: none;
        stroke: #73daca;
        stroke-width: 1;
        animation: ringExpand 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        transform-origin: 425px 15px;
      }

      .laser-dot {
        fill: #7aa2f7;
        animation: laserTravel 6s linear infinite;
      }

      @keyframes pulseLine {
        0% { stroke-width: 1; opacity: 0.6; }
        100% { stroke-width: 2.2; opacity: 1; filter: drop-shadow(0 0 4px rgba(187, 154, 243, 0.6)); }
      }

      @keyframes rotateSymbol {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes ringExpand {
        0% { r: 4; opacity: 1; stroke-width: 1.5; }
        100% { r: 16; opacity: 0; stroke-width: 0.5; }
      }

      @keyframes laserTravel {
        0% { cx: 100; opacity: 0; }
        5% { opacity: 1; }
        95% { opacity: 1; }
        100% { cx: 750; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Animated Ring Pulses from Center -->
  <circle cx="425" cy="15" r="8" class="pulse-ring" />
  <circle cx="425" cy="15" r="8" class="pulse-ring" style="animation-delay: -1.25s;" />

  <!-- Main glowing line -->
  <line x1="50" y1="15" x2="800" y2="15" class="glow-line" />

  <!-- Laser particle travel -->
  <circle cx="100" cy="15" r="2.5" class="laser-dot" filter="url(#neon-glow)" />

  <!-- Central Symbol (Rotating Diamond) -->
  <polygon points="425,7 433,15 425,23 417,15" class="center-symbol" filter="url(#neon-glow)" />
  <circle cx="425" cy="15" r="2" fill="#73daca" />
</svg>
