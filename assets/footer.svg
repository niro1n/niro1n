<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 80" width="100%" height="100%">
  <defs>
    <style>
      .wave-group {
        transform: translate(0, 0);
      }
      .wave {
        animation: waveAnim 12s linear infinite;
      }
      .wave1 {
        fill: #7aa2f7;
        fill-opacity: 0.15;
        animation-duration: 12s;
      }
      .wave2 {
        fill: #bb9af3;
        fill-opacity: 0.20;
        animation-duration: 8s;
        animation-delay: -2s;
      }
      .wave3 {
        fill: #73daca;
        fill-opacity: 0.25;
        animation-duration: 6s;
        animation-delay: -4s;
      }
      @keyframes waveAnim {
        0% {
          transform: translateX(0px);
        }
        100% {
          transform: translateX(-425px);
        }
      }
    </style>
  </defs>
  <!-- Background transparent -->
  <rect width="100%" height="100%" fill="none" />
  
  <!-- Overlapping Animated Waves -->
  <g class="wave-group">
    <!-- Wave 1 (Slowest, back) -->
    <path class="wave wave1" d="M 0 30 Q 106.25 15 212.5 30 T 425 30 T 637.5 30 T 850 30 T 1062.5 30 T 1275 30 T 1487.5 30 T 1700 30 L 1700 80 L 0 80 Z" />
    <!-- Wave 2 (Medium, middle) -->
    <path class="wave wave2" d="M 0 35 Q 106.25 20 212.5 35 T 425 35 T 637.5 35 T 850 35 T 1062.5 35 T 1275 35 T 1487.5 35 T 1700 35 L 1700 80 L 0 80 Z" />
    <!-- Wave 3 (Fastest, front) -->
    <path class="wave wave3" d="M 0 40 Q 106.25 25 212.5 40 T 425 40 T 637.5 40 T 850 40 T 1062.5 40 T 1275 40 T 1487.5 40 T 1700 40 L 1700 80 L 0 80 Z" />
  </g>
</svg>
