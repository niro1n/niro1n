<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#141622" />
    </linearGradient>
    
    <!-- Text Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af3" />
      <stop offset="100%" stop-color="#73daca" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7aa2f7" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 32px;
        fill: url(#text-grad);
        letter-spacing: 4px;
        animation: namePulse 6s ease-in-out infinite alternate;
      }

      .subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 14px;
        fill: #a9b1d6;
        letter-spacing: 4px;
        opacity: 0.9;
      }

      .tagline {
        font-family: 'Outfit', sans-serif;
        font-weight: 400;
        font-size: 12px;
        fill: #565f89;
        letter-spacing: 2px;
      }

      .grid-line {
        stroke: #1a1b26;
        stroke-width: 1;
        opacity: 0.3;
      }

      .circuit-path {
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: drawCircuit 8s linear infinite;
      }

      .circuit-dot {
        animation: pulseDot 2s ease-in-out infinite;
      }

      @keyframes drawCircuit {
        0% { stroke-dashoffset: 200; opacity: 0.1; }
        20% { opacity: 0.8; }
        60% { stroke-dashoffset: 0; opacity: 0.8; }
        80% { opacity: 0.1; }
        100% { stroke-dashoffset: -200; opacity: 0.1; }
      }

      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.5); opacity: 1; filter: drop-shadow(0 0 5px #7aa2f7); }
      }

      @keyframes namePulse {
        0% { filter: drop-shadow(0 0 2px rgba(122, 162, 247, 0.2)); }
        100% { filter: drop-shadow(0 0 12px rgba(187, 154, 243, 0.6)); }
      }

      .floating-particle {
        animation: float 4s ease-in-out infinite alternate;
      }

      @keyframes float {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-10px) translateX(5px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" />

  <!-- Grid Pattern -->
  <g>
    <!-- Vertical Grid Lines -->
    <line x1="50" y1="0" x2="50" y2="260" class="grid-line" />
    <line x1="100" y1="0" x2="100" y2="260" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="260" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="260" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="260" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="260" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="260" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="260" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="260" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="260" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="260" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="260" class="grid-line" />
    <line x1="650" y1="0" x2="650" y2="260" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="260" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="260" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="260" class="grid-line" />
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="40" x2="850" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="850" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="850" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="850" y2="160" class="grid-line" />
    <line x1="0" y1="200" x2="850" y2="200" class="grid-line" />
    <line x1="0" y1="240" x2="850" y2="240" class="grid-line" />
  </g>

  <!-- Glowing Tech Accents (Circuit Board Style) -->
  <g filter="url(#soft-glow)">
    <!-- Circuit Path Left -->
    <path d="M 50,130 L 150,130 L 180,100 L 220,100" class="circuit-path" stroke="#7aa2f7" stroke-width="2" />
    <!-- Circuit Path Right -->
    <path d="M 800,130 L 700,130 L 670,160 L 630,160" class="circuit-path" stroke="#bb9af3" stroke-width="2" />
    <!-- Additional decorative circuit paths -->
    <path d="M 120,40 L 120,80 L 160,120" class="circuit-path" stroke="#73daca" stroke-width="1.5" />
    <path d="M 730,220 L 730,180 L 690,140" class="circuit-path" stroke="#f7768e" stroke-width="1.5" />
  </g>

  <!-- Circuit nodes -->
  <circle cx="220" cy="100" r="4" fill="#7aa2f7" class="circuit-dot" />
  <circle cx="630" cy="160" r="4" fill="#bb9af3" class="circuit-dot" />
  <circle cx="160" cy="120" r="3" fill="#73daca" class="circuit-dot" />
  <circle cx="690" cy="140" r="3" fill="#f7768e" class="circuit-dot" />

  <!-- Floating Tech Symbols or Dots -->
  <circle cx="90" cy="190" r="2" fill="#7aa2f7" opacity="0.6" class="floating-particle" />
  <circle cx="760" cy="70" r="3" fill="#bb9af3" opacity="0.5" class="floating-particle" style="animation-delay: -2s;" />
  <circle cx="425" cy="50" r="1.5" fill="#73daca" opacity="0.4" class="floating-particle" style="animation-delay: -1s;" />

  <!-- Text & Logo -->
  <g transform="translate(425, 125)" text-anchor="middle">
    <!-- Main Title -->
    <text y="-5" class="title">SYAHFRINO REZKY OKTAVIANT</text>
    
    <!-- Subtitle -->
    <text y="42" class="subtitle">FULL STACK DEVELOPER</text>
    
    <!-- Tech Stack / Keywords / Tagline -->
    <text y="75" class="tagline">SOFTWARE DEVELOPER • TECHNOLOGY ENTHUSIAST • OPEN SOURCE LEARNER</text>
  </g>

  <!-- High-tech corner frames -->
  <path d="M 15 35 L 15 15 L 35 15" stroke="#7aa2f7" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 835 35 L 835 15 L 815 15" stroke="#bb9af3" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 15 225 L 15 245 L 35 245" stroke="#73daca" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 835 225 L 835 245 L 815 245" stroke="#f7768e" stroke-width="2.5" fill="none" opacity="0.7"/>
</svg>
